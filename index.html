<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>IRIAM 配信補助ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ac: #4ecde6;
  --ac-light: #d0f5fb;
  --ac-dark: #2aa8c0;
  --bg: #f4fcfe;
  --white: #ffffff;
  --border: #cdeef5;
  --text: #1a3a42;
  --text2: #7aaab5;
  --red: #ff5c6a;
  --green: #3dcc7a;
  --shadow: 0 2px 12px rgba(78,205,230,0.13);
  --shadow-strong: 0 4px 20px rgba(78,205,230,0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'M PLUS Rounded 1c', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* HEADER */
header { background: var(--white); border-bottom: 2px solid var(--border); box-shadow: var(--shadow); padding: 10px 14px 0; position: sticky; top: 0; z-index: 200; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.logo { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; color: var(--ac-dark); letter-spacing: -0.02em; white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 6px; }
.color-btn { background: var(--ac-light); border: 2px solid var(--border); color: var(--ac-dark); padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 900; cursor: pointer; font-family: inherit; white-space: nowrap; }
.reset-all-btn { background: #fff0f2; border: 2px solid #ffd0d6; color: var(--red); padding: 5px 10px; border-radius: 16px; font-size: 11px; font-weight: 900; cursor: pointer; font-family: inherit; white-space: nowrap; }

/* COLOR PICKER MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--white); border-radius: 24px; padding: 22px; width: 88%; max-width: 340px; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
.modal-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; margin-bottom: 16px; text-align: center; }
.color-presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
.color-preset { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s; }
.color-preset:active { transform: scale(0.88); }
.color-preset.selected { border-color: var(--text); }
.color-custom-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.color-custom-label { font-size: 12px; font-weight: 900; color: var(--text2); }
.color-input { width: 44px; height: 44px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; padding: 2px; background: none; }
.modal-close { width: 100%; padding: 12px; background: var(--ac); border: none; border-radius: 14px; color: white; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer; }

/* TABS */
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 8px 12px 9px; border-radius: 10px 10px 0 0; border: 2px solid transparent; border-bottom: none; background: transparent; color: var(--text2); font-family: inherit; font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; position: relative; bottom: -2px; display: flex; align-items: center; gap: 4px; }
.tab.active { background: var(--white); color: var(--text); border-color: var(--border); border-bottom-color: var(--white); }

/* MAIN */
main { padding: 14px; }
.page { display: none; }
.page.active { display: block; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* PAGE HEAD */
.page-head { background: var(--white); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); border: 2px solid var(--border); }
.page-head-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.page-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 17px; display: flex; align-items: center; gap: 7px; }
.prog-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.prog-text { font-size: 12px; font-weight: 900; color: var(--text2); }
.prog-text span { font-size: 19px; color: var(--text); font-family: 'Nunito', sans-serif; }
.prog-text.done span { color: var(--green); }
.done-badge { display: inline-flex; align-items: center; gap: 3px; background: #e6fff2; border: 2px solid #b0f0cc; color: var(--green); font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 20px; }
.reset-btn { background: var(--ac-light); border: 2px solid var(--border); color: var(--ac-dark); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 900; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
.reset-btn:active { transform: scale(0.93); }

/* PROGRESS BAR */
.prog-bar-wrap { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 4px; background: var(--ac); transition: width 0.4s cubic-bezier(.34,1.56,.64,1); }

/* CHECK GRID */
.check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 14px; }
.check-grid.cols2 { grid-template-columns: repeat(2, 1fr); }
.check-grid.cols4 { grid-template-columns: repeat(4, 1fr); }

.check-item { background: var(--white); border: 2px solid var(--border); border-radius: 13px; padding: 9px 8px; cursor: pointer; transition: all 0.14s; display: flex; align-items: center; gap: 6px; user-select: none; box-shadow: var(--shadow); }
.check-item:active { transform: scale(0.93); }
.check-item.checked { background: var(--ac-light); border-color: var(--ac); opacity: 0.7; }
.cb { width: 19px; height: 19px; border-radius: 5px; border: 2.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all 0.14s; background: var(--white); }
.check-item.checked .cb { background: var(--ac); border-color: var(--ac); color: white; }
.cl { font-size: 11px; font-weight: 900; line-height: 1.2; }
.check-item.checked .cl { text-decoration: line-through; color: var(--text2); }
.cs { font-size: 9px; color: var(--text2); margin-top: 1px; }

/* MBTI */
.mbti-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mbti-item { background: var(--white); border: 2px solid var(--border); border-radius: 14px; padding: 11px; cursor: pointer; transition: all 0.14s; display: flex; align-items: center; gap: 9px; user-select: none; box-shadow: var(--shadow); }
.mbti-item:active { transform: scale(0.94); }
.mbti-item.checked { background: var(--ac-light); border-color: var(--ac); opacity: 0.65; }
.mbti-item.checked .cb { background: var(--ac); border-color: var(--ac); color: white; }
.mbti-code { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; }
.mbti-name { font-size: 9px; color: var(--text2); margin-top: 1px; }

/* MULTI COUNTER */
.counter-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.counter-item-card { background: var(--white); border: 2px solid var(--border); border-radius: 18px; padding: 14px 14px 12px; box-shadow: var(--shadow); }
.counter-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.counter-item-name { flex: 1; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 900; padding: 7px 10px; outline: none; transition: border-color 0.16s; }
.counter-item-name:focus { border-color: var(--ac); }
.counter-item-del { background: #fff0f2; border: 2px solid #ffd0d6; border-radius: 10px; color: var(--red); font-family: inherit; font-size: 13px; font-weight: 900; padding: 7px 10px; cursor: pointer; flex-shrink: 0; }
.counter-item-del:active { transform: scale(0.92); }
.counter-item-num { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 52px; line-height: 1; color: var(--ac-dark); text-align: center; display: block; transition: color 0.2s; }
.counter-item-num.danger { color: var(--red); }
.counter-item-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.btn-mid { padding: 12px; border-radius: 13px; border: none; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 20px; cursor: pointer; transition: all 0.13s; }
.btn-mid:active { transform: scale(0.91); }
.counter-item-quick { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.counter-item-custom { display: flex; gap: 6px; margin-top: 7px; align-items: center; }
.counter-item-custom-input { width: 72px; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 900; padding: 8px 6px; text-align: center; outline: none; }
.counter-item-custom-input:focus { border-color: var(--ac); }
.btn-custom-s { border-radius: 10px; font-family: inherit; font-size: 11px; font-weight: 900; padding: 8px 11px; cursor: pointer; border: 2px solid; white-space: nowrap; }
.btn-custom-s:active { transform: scale(0.91); }
.counter-item-set { display: flex; gap: 6px; margin-top: 7px; align-items: center; }
.counter-item-set-input { flex: 1; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 900; padding: 8px 10px; text-align: center; outline: none; }
.counter-item-set-input:focus { border-color: var(--ac); }
.btn-set-s { background: var(--ac); border: none; border-radius: 10px; color: white; font-family: inherit; font-size: 12px; font-weight: 900; padding: 8px 13px; cursor: pointer; white-space: nowrap; }
.btn-set-s:active { transform: scale(0.92); }
.add-counter-btn { width: 100%; padding: 14px; border-radius: 16px; border: 2px dashed var(--border); background: var(--white); color: var(--ac-dark); font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px; cursor: pointer; transition: all 0.16s; }
.add-counter-btn:active { transform: scale(0.97); }

/* STAR CONSTELLATION */
.star-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.star-illo-card { background: var(--white); border: 2px solid var(--border); border-radius: 16px; padding: 12px 8px 8px; text-align: center; box-shadow: var(--shadow); }
.star-illo-card svg { width: 70px; height: 70px; display: block; margin: 0 auto 6px; }
.star-illo-name { font-size: 11px; font-weight: 900; }
.star-illo-en { font-size: 9px; color: var(--text2); }

/* GIFT */
.gift-cat-card { background: var(--white); border: 2px solid var(--border); border-radius: 18px; padding: 13px; margin-bottom: 12px; box-shadow: var(--shadow); }
.gift-cat-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.cat-pill { font-size: 12px; font-weight: 900; padding: 4px 11px; border-radius: 20px; display: inline-flex; align-items: center; }
.cat-count { font-size: 12px; font-weight: 900; color: var(--text2); }
.cat-count.done { color: var(--green); }

/* ANY COUNTER */
.any-card { background: var(--white); border: 2px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.any-label { font-size: 11px; font-weight: 900; color: var(--text2); white-space: nowrap; }
.any-num-input { width: 72px; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 900; padding: 9px 6px; text-align: center; outline: none; transition: border-color 0.15s; }
.any-num-input:focus { border-color: var(--ac); }
.any-op-btn { width: 52px; height: 52px; border-radius: 12px; border: 2px solid; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.13s; flex-shrink: 0; }
.any-op-btn:active { transform: scale(0.90); }
.any-minus { background: #fff0f2; border-color: #ffd0d6; color: var(--red); }
.any-plus  { background: #efffef; border-color: #c0f0cc; color: var(--green); }
.any-del { background: transparent; border: none; color: var(--text2); font-size: 16px; cursor: pointer; padding: 4px 6px; margin-left: auto; flex-shrink: 0; }
.any-del:active { transform: scale(0.88); }

/* GACHA */
.gacha-wrap { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--white); border: 2px solid var(--border); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.card-label { font-size: 12px; font-weight: 900; color: var(--text2); margin-bottom: 9px; }
.gacha-textarea { width: 100%; background: var(--bg); border: 2px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 700; padding: 11px 13px; resize: vertical; min-height: 110px; outline: none; line-height: 1.7; transition: border-color 0.16s; }
.gacha-textarea:focus { border-color: var(--ac); }
.gacha-textarea::placeholder { color: var(--text2); }
.gacha-count { font-size: 11px; font-weight: 900; color: var(--text2); text-align: right; margin-top: 5px; }
.gacha-btn { width: 100%; padding: 17px; border-radius: 16px; border: none; background: var(--ac); color: white; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; transition: all 0.16s; box-shadow: 0 4px 16px rgba(78,205,230,0.35); }
.gacha-btn:active { transform: scale(0.96); }
.gacha-result-inner { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.gacha-placeholder { font-size: 13px; color: var(--text2); font-weight: 700; }
.gacha-result-label { font-size: 11px; color: var(--text2); font-weight: 900; letter-spacing: 0.06em; margin-bottom: 7px; }
.gacha-result-text { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px; color: var(--ac-dark); animation: popIn 0.32s cubic-bezier(.34,1.56,.64,1); line-height: 1.3; word-break: break-all; }
@keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.hist-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 11px; background: var(--bg); border-radius: 9px; margin-bottom: 5px; font-size: 13px; font-weight: 700; }
.hist-num { font-size: 10px; color: var(--text2); font-weight: 900; }

/* CONFETTI */
.confetti { position: fixed; pointer-events: none; z-index: 9999; font-size: 22px; animation: confettiFall linear forwards; }
@keyframes confettiFall { 0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1} 100%{transform:translateY(110vh) rotate(540deg) scale(0.5);opacity:0} }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- COLOR PICKER MODAL -->
<div class="modal-overlay" id="color-modal">
  <div class="modal">
    <div class="modal-title">🎨 テーマカラーを選ぶ</div>
    <div class="color-presets" id="color-presets"></div>
    <div class="color-custom-row">
      <span class="color-custom-label">カスタム：</span>
      <input type="color" class="color-input" id="custom-color-input" value="#4ecde6">
      <span style="font-size:12px;font-weight:900;color:var(--text2)">← 自由に選択</span>
    </div>
    <button class="modal-close" onclick="closeColorModal()">✓ 決定</button>
  </div>
</div>

<header>
  <div class="header-top">
    <div class="logo">🎙 配信補助ツール</div>
    <div class="header-right">
      <button class="color-btn" onclick="openColorModal()">🎨 カラー</button>
      <button class="reset-all-btn" onclick="resetAll()">🗑 全リセット</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>

<!-- 都道府県 -->
<div class="page" id="page-pref">
  <div class="page-head">
    <div class="page-head-top">
      <div class="page-title">🗾 47都道府県</div>
      <button class="reset-btn" id="reset-btn-pref" onclick="resetSection('pref')">リセット</button>
    </div>
    <div class="prog-row">
      <div class="prog-text" id="prog-text-pref"><span>0</span> / 47</div>
      <div id="done-pref"></div>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="bar-pref" style="width:0%"></div></div>
  </div>
  <div class="check-grid cols4" id="grid-pref"></div>
</div>

<!-- 星座 -->
<div class="page" id="page-star">
  <div class="page-head">
    <div class="page-head-top">
      <div class="page-title">⭐ 12星座</div>
      <button class="reset-btn" id="reset-btn-star" onclick="resetSection('star')">リセット</button>
    </div>
    <div class="prog-row">
      <div class="prog-text" id="prog-text-star"><span>0</span> / 12</div>
      <div id="done-star"></div>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="bar-star" style="width:0%"></div></div>
  </div>
  <div class="check-grid cols2" id="grid-star"></div>
  <div class="card" style="margin-top:14px">
    <div class="card-label">✨ 星座イラスト</div>
    <div class="star-grid" id="star-illo-grid"></div>
  </div>
</div>

<!-- MBTI -->
<div class="page" id="page-mbti">
  <div class="page-head">
    <div class="page-head-top">
      <div class="page-title">🧠 MBTI</div>
      <button class="reset-btn" id="reset-btn-mbti" onclick="resetSection('mbti')">リセット</button>
    </div>
    <div class="prog-row">
      <div class="prog-text" id="prog-text-mbti"><span>0</span> / 16</div>
      <div id="done-mbti"></div>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar" id="bar-mbti" style="width:0%"></div></div>
  </div>
  <div class="mbti-grid" id="grid-mbti"></div>
</div>

<!-- ギフト -->
<div class="page" id="page-gift">
  <div id="gift-content"></div>
</div>

<!-- カウンター -->
<div class="page" id="page-counter">
  <div class="counter-list" id="counter-list"></div>
  <button class="add-counter-btn" onclick="addCounter()">＋ カウンターを追加</button>

  <div style="margin-top:20px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:14px;color:var(--text2)">🛟 任意カウンター</div>
    <button class="add-counter-btn" style="width:auto;padding:8px 16px;font-size:13px" onclick="addAny()">＋ 追加</button>
  </div>
  <div id="any-list"></div>
</div>

<!-- 企画ガチャ -->
<div class="page" id="page-gacha">
  <div class="gacha-wrap">
    <div class="card">
      <div class="card-label">📝 企画リスト（1行1企画）</div>
      <textarea class="gacha-textarea" id="gacha-input"
        placeholder="例：&#10;雑談配信&#10;歌ってみた&#10;お絵描き配信&#10;ゲーム実況"
        oninput="updateGachaCount()"></textarea>
      <div class="gacha-count" id="gacha-count">0 件</div>
    </div>
    <button class="gacha-btn" onclick="doGacha()">🎲 ガチャを引く！</button>
    <div class="card">
      <div class="gacha-result-inner" id="gacha-result">
        <div class="gacha-placeholder">まだ引いていません</div>
      </div>
    </div>
    <div class="card" id="gacha-history-card" style="display:none">
      <div class="card-label">📋 履歴</div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

</main>
<script>
// ===== DATA =====
const PREFS = ['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];

const STARS = [
  {n:'おひつじ座',e:'Aries',i:'♈'},
  {n:'おうし座',e:'Taurus',i:'♉'},
  {n:'ふたご座',e:'Gemini',i:'♊'},
  {n:'かに座',e:'Cancer',i:'♋'},
  {n:'しし座',e:'Leo',i:'♌'},
  {n:'おとめ座',e:'Virgo',i:'♍'},
  {n:'てんびん座',e:'Libra',i:'♎'},
  {n:'さそり座',e:'Scorpio',i:'♏'},
  {n:'いて座',e:'Sagittarius',i:'♐'},
  {n:'やぎ座',e:'Capricorn',i:'♑'},
  {n:'みずがめ座',e:'Aquarius',i:'♒'},
  {n:'うお座',e:'Pisces',i:'♓'},
];

const MBTI_LIST = [

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function lighten(hex, amt=0.82) {
  const {r,g,b} = hexToRgb(hex);
  const mix = (c) => Math.round(c + (255-c)*amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function darken(hex, amt=0.25) {
  const {r,g,b} = hexToRgb(hex);
  const d = (c) => Math.round(c*(1-amt));
  return `rgb(${d(r)},${d(g)},${d(b)})`;
}

function applyColor(hex) {
  const root = document.documentElement;
  root.style.setProperty('--ac', hex);
  root.style.setProperty('--ac-light', lighten(hex, 0.85));
  root.style.setProperty('--ac-dark', darken(hex, 0.2));
  root.style.setProperty('--border', lighten(hex, 0.7));
  root.style.setProperty('--bg', lighten(hex, 0.93));
}

}

// ===== PROGRESS =====
function updateProg(sec, total) {
  const count = state[sec].size;
  const bar = document.getElementById('bar-'+sec);
  const pt  = document.getElementById('prog-text-'+sec);
  const dn  = document.getElementById('done-'+sec);
  if (bar) bar.style.width = (total ? count/total*100 : 0) + '%';
  if (pt)  { pt.innerHTML=`<span>${count}</span> / ${total}`; pt.className='prog-text'+(count===total&&total?' done':''); }
  if (dn)  dn.innerHTML = (count===total&&total>0) ? '<span class="done-badge">🎉 コンプリート！</span>' : '';
  if (count===total&&total>0) celebrate();
}

function updateGiftCat(cat) {
  const count = state.gift[cat].size;
  const total = GIFTS[cat].items.length;
  const el  = document.getElementById('cat-count-'+cat);
  const bar = document.getElementById('bar-gift-'+cat);
  if (el)  { el.textContent=`${count} / ${total}`; el.className='cat-count'+(count===total?' done':''); }
  if (bar) bar.style.width = (count/total*100)+'%';
}

function updateGiftAll() {
  const total = Object.values(GIFTS).reduce((s,g)=>s+g.items.length,0);

}

    <span class="any-label">任意＋</span>
    <input class="any-num-input" type="number" id="any-plus-val-${id}" value="3" min="1">
    <button class="any-op-btn any-plus" onclick="doAny(${id},+1)">＋</button>
    <button class="any-del" onclick="document.getElementById('any-card-${id}').remove()" title="削除">✕</button>
  `;
  list.appendChild(card);
}

function doAny(id, sign) {
  const inputId = sign < 0 ? `any-minus-val-${id}` : `any-plus-val-${id}`;
  const v = parseInt(document.getElementById(inputId).value) || 1;
  state.counters.forEach(c => {
    c.value = Math.max(0, c.value + sign * v);
    updateCounterDisplay(c.id);
  });
}

function removeCounter(id) {
  state.counters = state.counters.filter(c=>c.id!==id);
  renderCounterList();
}

function changeCounterVal(id, delta) {
  const c = state.counters.find(c=>c.id===id);
  if (!c) return;
  c.value = Math.max(0, c.value + delta);
  updateCounterDisplay(id);
}

function doCustomChange(id, sign) {
  const c = state.counters.find(c=>c.id===id);
  if (!c) return;
  const inputId = sign < 0 ? `custom-minus-${id}` : `custom-plus-${id}`;
  const v = parseInt(document.getElementById(inputId).value) || 1;
  c.value = Math.max(0, c.value + sign * v);
  updateCounterDisplay(id);
}

function setCounterVal(id) {
  const c = state.counters.find(c=>c.id===id);
  if (!c) return;
  const v = parseInt(document.getElementById(`set-input-${id}`).value);
  if (!isNaN(v) && v >= 0) { c.value = v; c.initVal = v; updateCounterDisplay(id); }
}

function resetCounterVal(id) {
  const c = state.counters.find(c=>c.id===id);
  if (!c) return;
  c.value = c.initVal;
  updateCounterDisplay(id);
}

function updateCounterDisplay(id) {
  const c = state.counters.find(c=>c.id===id);
  if (!c) return;
  const el = document.getElementById(`cnum-${id}`);
  if (el) { el.textContent = c.value; el.className = 'counter-item-num' + (c.value <= 10 ? ' danger' : ''); }
}

function renderCounterList() {
  const list = document.getElementById('counter-list');
  list.innerHTML = '';
  state.counters.forEach(c => {
    const card = document.createElement('div');
    card.className = 'counter-item-card';
    card.innerHTML = `
      <div class="counter-item-top">
        <input class="counter-item-name" type="text" value="${c.name}" placeholder="カウンター名"
          oninput="state.counters.find(x=>x.id===${c.id}).name=this.value">
        <button class="counter-item-del" onclick="removeCounter(${c.id})">✕</button>
        <button class="reset-btn" onclick="resetCounterVal(${c.id})">リセット</button>
      </div>
      <span class="counter-item-num${c.value<=10?' danger':''}" id="cnum-${c.id}">${c.value}</span>
      <div class="counter-item-btns">
        <button class="btn-mid btn-minus" onclick="changeCounterVal(${c.id},-1)">－ 1</button>
        <button class="btn-mid btn-plus"  onclick="changeCounterVal(${c.id},+1)">＋ 1</button>
      </div>
      <div class="counter-item-quick">
        <button class="btn-quick" onclick="changeCounterVal(${c.id},-10)">－10</button>
        <button class="btn-quick" onclick="changeCounterVal(${c.id},-5)">－5</button>
        <button class="btn-quick" onclick="changeCounterVal(${c.id},+5)">＋5</button>
        <button class="btn-quick" onclick="changeCounterVal(${c.id},+10)">＋10</button>
      </div>
      <div class="counter-item-custom">
        <span style="font-size:11px;font-weight:900;color:var(--text2);white-space:nowrap">任意－</span>
        <input class="counter-item-custom-input" type="number" id="custom-minus-${c.id}" value="3" min="1">
        <button class="btn-custom-s" style="background:#fff0f2;border-color:#ffd0d6;color:var(--red)" onclick="doCustomChange(${c.id},-1)">－</button>
        <span style="font-size:11px;font-weight:900;color:var(--text2);white-space:nowrap;margin-left:4px">任意＋</span>
        <input class="counter-item-custom-input" type="number" id="custom-plus-${c.id}" value="3" min="1">
        <button class="btn-custom-s" style="background:#efffef;border-color:#c0f0cc;color:var(--green)" onclick="doCustomChange(${c.id},+1)">＋</button>
      </div>
      <div class="counter-item-set">
        <input class="counter-item-set-input" type="number" id="set-input-${c.id}" placeholder="初期値をセット" value="${c.initVal}">
        <button class="btn-set-s" onclick="setCounterVal(${c.id})">セット</button>
      </div>
    `;
    list.appendChild(card);
  });
}

// ===== GACHA =====
function updateGachaCount() {
  const n = document.getElementById('gacha-input').value.split('\n').filter(l=>l.trim()).length;
  document.getElementById('gacha-count').textContent = n + ' 件';
}
function doGacha() {
  const lines = document.getElementById('gacha-input').value.split('\n').filter(l=>l.trim());
  if (!lines.length) return;
  const pick = lines[Math.floor(Math.random() * lines.length)];
  const r = document.getElementById('gacha-result');
  r.innerHTML = `<div class="gacha-result-label">✨ 今回の企画</div><div class="gacha-result-text">${pick}</div>`;
  state.gachaHistory.unshift(pick);
  const card = document.getElementById('gacha-history-card');
  const list = document.getElementById('history-list');
  card.style.display = 'block';
  list.innerHTML = state.gachaHistory.slice(0,20).map((h,i)=>
    `<div class="hist-item"><span>${h}</span><span class="hist-num">#${state.gachaHistory.length-i}</span></div>`
  ).join('');
}

// ===== CELEBRATE =====
function celebrate() {
  const e = ['🎉','✨','🌟','💫','🎊','🌈','💖','🥳'];
  for (let i=0;i<16;i++) {
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = e[Math.floor(Math.random()*e.length)];
      el.style.left = Math.random()*100+'vw';
      el.style.top = '-40px';
      el.style.animationDuration = (1.2+Math.random()*0.8)+'s';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2200);
    },i*60);
  }
}

buildPresets();
initTabs();
buildPref();
buildStar();
buildMBTI();
rebuildGifts();
addCounter('入室耐久', 100);
switchTab('pref');
</script>
